# Deployment per SSH auf den Server von wer-ist-daniel-schwarz.de. Dort liefert Caddy die Instrument-Seiten nur lesend
# aus (Repo frag-daniel, infra/Caddyfile.prod), die Vorschauen daneben unter eigenem Pfad.
#
#   Produktion  https://ukulele.wer-ist-daniel-schwarz.de/  ← dist/ukulele  (Server: app/)
#               https://gitarre.wer-ist-daniel-schwarz.de/  ← dist/gitarre  (Server: app-gitarre/)
#               https://banjo.wer-ist-daniel-schwarz.de/    ← dist/banjo    (Server: app-banjo/)
#               https://bariton.wer-ist-daniel-schwarz.de/  ← dist/bariton  (Server: app-bariton/)
#               https://mandoline.wer-ist-daniel-schwarz.de/ ← dist/mandoline (Server: app-mandoline/)
#   Eigene Domain (Variable SITE_DOMAIN gesetzt, z. B. openstring.de):
#               https://<SITE_DOMAIN>/ (Instrumentenwahl), https://<SITE_DOMAIN>/ukulele/, …  ← dist/  (Server: site/)
#               Die alten Subdomains werden zu Weiterleitungen dorthin, die die Daten im Browser mitnehmen (MOVE_TO).
#   Vorschau    https://ukulele.wer-ist-daniel-schwarz.de/<UKULELE_PREVIEW_PATH>/pr-<nr>/<seite>/  ← dist/ je Pull Request
#
# Secrets: DEPLOY_HOST, DEPLOY_USER (Standard root), DEPLOY_SSH_KEY, LEGAL_ADDRESS/LEGAL_EMAIL (Impressum, nur verpackt in der Seite). Variablen: UKULELE_PREVIEW_PATH, UKULELE_HOST (optional), SITE_DOMAIN (optional: eigene Domain).
# Caddy für SITE_DOMAIN: root auf site/, file_server mit try_files {path} {path}/index.html und handle_errors → 404.html
# des jeweiligen Unterordners (Repo frag-daniel).
# Forks bekommen keine Secrets – die Deployments werden dann sauber übersprungen.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  SERVER_DIR: /mnt/frag-daniel/ukulele

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerequisites:
    name: Voraussetzungen
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      UKULELE_PREVIEW_PATH: ${{ vars.UKULELE_PREVIEW_PATH }}
      UKULELE_HOST: ${{ vars.UKULELE_HOST || 'ukulele.wer-ist-daniel-schwarz.de' }}
    outputs:
      production: ${{ steps.check.outputs.production }}
      preview: ${{ steps.check.outputs.preview }}
      preview_base: ${{ steps.check.outputs.preview_base }}
    steps:
      - id: check
        run: |
          production=false
          preview=false
          if [ -n "$DEPLOY_HOST" ]; then production=true; else echo "::notice::DEPLOY_HOST fehlt – kein Deployment."; fi
          if [ -n "$DEPLOY_HOST" ] && [ -n "$UKULELE_PREVIEW_PATH" ]; then preview=true; else echo "::notice::keine Vorschau (DEPLOY_HOST/UKULELE_PREVIEW_PATH fehlt)."; fi
          {
            echo "production=$production"
            echo "preview=$preview"
            echo "preview_base=https://$UKULELE_HOST/$UKULELE_PREVIEW_PATH"
          } >> "$GITHUB_OUTPUT"

  production:
    name: Produktion
    needs: prerequisites
    if: needs.prerequisites.outputs.production == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.SITE_DOMAIN && format('https://{0}/', vars.SITE_DOMAIN) || format('https://{0}/', vars.UKULELE_HOST || 'ukulele.wer-ist-daniel-schwarz.de') }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      UKULELE_HOST: ${{ vars.UKULELE_HOST || 'ukulele.wer-ist-daniel-schwarz.de' }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: SSH-Schlüssel
        run: .github/scripts/ssh-setup.sh
      - name: Subdomains (ohne eigene Domain)
        if: env.SITE_DOMAIN == ''
        env:
          SITE_URL: https://{site}.wer-ist-daniel-schwarz.de/
          PUBLIC_URL: https://{site}.wer-ist-daniel-schwarz.de/
          LEGAL_ADDRESS: ${{ secrets.LEGAL_ADDRESS }}
          LEGAL_EMAIL: ${{ secrets.LEGAL_EMAIL }}
        run: |
          npm run build
          .github/scripts/upload-dir.sh dist/ukulele "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app"
          .github/scripts/upload-dir.sh dist/gitarre "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app-gitarre"
          .github/scripts/upload-dir.sh dist/banjo "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app-banjo"
          .github/scripts/upload-dir.sh dist/bariton "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app-bariton"
          .github/scripts/upload-dir.sh dist/mandoline "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app-mandoline"
          curl -fsS --retry 5 --retry-delay 5 "https://$UKULELE_HOST/" | grep -q 'data-instrument="ukulele"'
          echo "Live: https://$UKULELE_HOST/"
      - name: Eigene Domain
        if: env.SITE_DOMAIN != ''
        env:
          LEGAL_ADDRESS: ${{ secrets.LEGAL_ADDRESS }}
          LEGAL_EMAIL: ${{ secrets.LEGAL_EMAIL }}
        run: |
          SITE_URL="https://$SITE_DOMAIN/{site}/" PUBLIC_URL="https://$SITE_DOMAIN/{site}/" npm run build
          .github/scripts/upload-dir.sh dist "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/site"
          curl -fsS --retry 5 --retry-delay 5 "https://$SITE_DOMAIN/ukulele/" | grep -q 'data-instrument="ukulele"'
          echo "Live: https://$SITE_DOMAIN/"
          # alte Subdomains: Weiterleitungen, die Sterne und eigene Lieder mitnehmen
          SITE_URL="https://{site}.wer-ist-daniel-schwarz.de/" PUBLIC_URL="https://{site}.wer-ist-daniel-schwarz.de/" MOVE_TO="https://$SITE_DOMAIN/{site}/" npm run build
          .github/scripts/upload-dir.sh dist/ukulele "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app"
          .github/scripts/upload-dir.sh dist/gitarre "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app-gitarre"
          .github/scripts/upload-dir.sh dist/banjo "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app-banjo"
          .github/scripts/upload-dir.sh dist/bariton "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app-bariton"
          .github/scripts/upload-dir.sh dist/mandoline "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/app-mandoline"

  preview:
    name: Vorschau
    needs: prerequisites
    if: needs.prerequisites.outputs.preview == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ needs.prerequisites.outputs.preview_base }}/pr-${{ github.event.pull_request.number }}/ukulele/
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      UKULELE_PREVIEW_PATH: ${{ vars.UKULELE_PREVIEW_PATH }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      URL: ${{ needs.prerequisites.outputs.preview_base }}/pr-${{ github.event.pull_request.number }}/ukulele/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build
        env:
          SITE_URL: ${{ needs.prerequisites.outputs.preview_base }}/pr-${{ github.event.pull_request.number }}/{site}/
          PUBLIC_URL: https://{site}.wer-ist-daniel-schwarz.de/
          PREVIEW: '1'
          LEGAL_ADDRESS: ${{ secrets.LEGAL_ADDRESS }}
          LEGAL_EMAIL: ${{ secrets.LEGAL_EMAIL }}
      - name: SSH-Schlüssel
        run: .github/scripts/ssh-setup.sh
      - name: Hochladen
        run: .github/scripts/upload-dir.sh dist "$DEPLOY_USER@$DEPLOY_HOST" "$SERVER_DIR/$UKULELE_PREVIEW_PATH/pr-$PULL_REQUEST_NUMBER"
      - name: Live-Prüfung
        run: |
          curl -fsS --retry 3 --retry-delay 5 "$URL" | grep -q 'data-instrument="ukulele"'
          echo "Live: $URL"
      - name: Kommentar im Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_STATUS: deployed
          PREVIEW_URL: ${{ env.URL }}
          DEPLOYED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/preview-comment.sh

  remove-preview:
    name: Vorschau entfernen
    needs: prerequisites
    if: needs.prerequisites.outputs.preview == 'true' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      UKULELE_PREVIEW_PATH: ${{ vars.UKULELE_PREVIEW_PATH }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH-Schlüssel
        run: .github/scripts/ssh-setup.sh
      - name: Verzeichnis löschen
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$SERVER_DIR/$UKULELE_PREVIEW_PATH/pr-$PULL_REQUEST_NUMBER'"
      - name: Environment deaktivieren
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=preview-pr-$PULL_REQUEST_NUMBER&per_page=100" --jq '.[].id'); do
            gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive -f description='Vorschau entfernt' --silent
          done
      - name: Kommentar im Pull Request
        env:
          PREVIEW_STATUS: removed
        run: .github/scripts/preview-comment.sh
